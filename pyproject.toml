[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-character-builder"
version = "1.0.0"
description = "A simple CLI tool for building Dungeons & Dragons (5e SRD) character sheets — and a hands-on learning project for new Python and GitHub contributors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MuckGX", email = "gxogdnd@gmail.com" }]
keywords = ["dnd", "dungeons-and-dragons", "character-sheet", "cli", "learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/gxogdnd/SimpleCharacterBuilder"
Issues = "https://github.com/gxogdnd/SimpleCharacterBuilder/issues"

[project.scripts]
charsheet = "charsheet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
charsheet = ["data/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# A friendly-but-useful starter rule set:
# E/W = pycodestyle, F = pyflakes, I = import sorting, UP = pyupgrade, B = bugbear.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
