name: CI

# Run the checks on every pull request and on pushes to the main branch.
# New contributors: when you open a PR, this is the green check (or red X)
# you will see at the bottom of the page. It must pass before we merge.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests (pytest)
        run: pytest
